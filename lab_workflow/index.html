<!DOCTYPE html>
<!--
  HayMedics Laboratory Information System — installable app (PWA) wrapper
  ======================================================================
  1) Uses the exact structure, splash screen, and robust PWA installer pattern.
  2) Includes the forced mobile fallback timeout to ensure the install button appears reliably.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>HayMedics Laboratory Information System</title>
<meta name="description" content="HayMedics Laboratory Information System — Comprehensive Lab Workflow Dashboard.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0284C7">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HayMedics Lab">
<style>
  :root{--primary:#0284C7;--accent:#38BDF8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--primary);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #app{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#fff}
  #splash{position:fixed;inset:0;z-index:10;background:radial-gradient(120% 90% at 20% 10%,#0369A1,#0284C7 55%,#0F172A);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .4s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .logo{width:96px;height:96px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(0,0,0,.35)}
  #splash h1{font-weight:800;font-size:1.5rem;margin-top:18px;letter-spacing:.3px}
  #splash p{color:#BAE6FD;font-size:.9rem;margin-top:4px}
  #splash .bar{margin-top:22px;width:150px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
  #splash .bar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:5px;animation:load 1.1s infinite ease-in-out}
  @keyframes load{0%{margin-left:-40%}100%{margin-left:100%}}
  #install{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:8px;background:var(--accent);color:#0F172A;border:none;border-radius:999px;padding:13px 22px;font-weight:800;font-size:.95rem;box-shadow:0 8px 22px rgba(0,0,0,.3);cursor:pointer}
  #ios{position:fixed;left:16px;right:16px;bottom:20px;z-index:20;display:none;background:rgba(255,255,255,.96);color:#0F172A;border-radius:14px;padding:14px 16px;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
  #ios b{color:var(--primary)}
</style>
</head>
<body>
  <div id="splash">
    <span class="logo">
      <!-- Laboratory Flask Icon -->
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 2v2.5M14 2v2.5M8.5 4.5h7M6.5 19.5a2.5 2.5 0 0 0 2.5 2.5h7a2.5 2.5 0 0 0 2.5-2.5V11a1 1 0 0 0-1-1H7.5a1 1 0 0 0-1 1z"></path>
        <path d="M10 14h4M9 17h6"></path>
      </svg>
    </span>
    <h1>HayMedics Lab</h1>
    <p>Laboratory Information System</p>
    <div class="bar"><i></i></div>
  </div>

  <iframe id="app" title="HayMedics Laboratory Information System" allow="clipboard-write; camera; microphone" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <button id="install"><span>⬇️</span> Install app</button>
  <div id="ios">📱 To install: tap <b>Share</b>, then <b>Add to Home Screen</b>.</div>

<script>
  /* ====== 1) YOUR APP LINK ====== */
  var APP_URL = "https://script.google.com/macros/s/AKfycbyDTs464mHViPoYbERKMkeeUIXf48RG1DJWnNX-b_B4wwNbnQf7jPC8HkOYpNx0qJzcEA/exec";

  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  frame.src = APP_URL;
  frame.addEventListener('load', function(){ setTimeout(function(){ splash.classList.add('hide'); }, 400); });
  setTimeout(function(){ splash.classList.add('hide'); }, 6000);

  /* ====== 2) Service worker: installable AND self-updating ====== */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        reg.update();
        reg.addEventListener('updatefound', function(){
          var sw = reg.installing; if(!sw) return;
          sw.addEventListener('statechange', function(){
            if(sw.state === 'installed' && navigator.serviceWorker.controller){ window.location.reload(); }
          });
        });
      }).catch(function(){});
      var reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){ if(reloaded) return; reloaded=true; window.location.reload(); });
    });
  }

  /* ====== 3) Android install button (with mobile fallback) ====== */
  var deferred = null;
  var installBtn = document.getElementById('install');

  window.addEventListener('beforeinstallprompt', function(e){ 
    e.preventDefault(); 
    deferred = e; 
    installBtn.style.display = 'inline-flex'; 
  });

  // Forced mobile fallback to guarantee visibility on mobile subdirectories
  setTimeout(function() {
    if (installBtn.style.display === 'none') {
      installBtn.style.display = 'inline-flex';
    }
  }, 3000);

  installBtn.addEventListener('click', function(){ 
    if (deferred) {
      deferred.prompt(); 
      deferred.userChoice.finally(function(){ 
        deferred = null; 
        installBtn.style.display='none'; 
      });
    } else {
      alert("To install: Tap your browser's menu (three dots in top right) and select 'Install app' or 'Add to Home screen'.");
    }
  });

  window.addEventListener('appinstalled', function(){ installBtn.style.display='none'; });

  /* ====== 4) iPhone hint ====== */
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (isIOS && !standalone) { setTimeout(function(){ document.getElementById('ios').style.display='block'; setTimeout(function(){ var el=document.getElementById('ios'); if(el) el.style.display='none'; }, 8000); }, 1500); }
</script>
</body>
</html>
