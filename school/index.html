<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a73e8">
    <title>HayMedics School Management System</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HayMedics SMS">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            color: #5f6368;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>Loading HayMedics Dashboard...</p>
    </div>

    <!-- Embedded Google Apps Script Web App URL -->
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbxhfEXQQ6jWc0iWf54CKJIxgktpKfA2txA0E4QLLor4iD_SHH_swn1fitPxaZqoUa5j/exec" onload="document.getElementById('loader').style.display='none';"></iframe>

    <!-- Custom PWA Install Button -->
    <button id="install-btn" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        Install HayMedics SMS
    </button>

    <script>
        // Register Service Worker for PWA Offline Caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registered! Scope: ', reg.scope))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        // Capture standard install event
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        // FORCED FALLBACK: Show button after 2 seconds for testing if browser suppresses event
        setTimeout(() => {
            if (installBtn.style.display === 'none') {
                installBtn.style.display = 'block';
            }
        }, 2000);

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('User choice:', outcome);
                deferredPrompt = null;
            } else {
                alert("To install this app, open your browser menu (three dots in Chrome/Edge) and select 'Install app' or 'Add to Home screen'.");
            }
            installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
