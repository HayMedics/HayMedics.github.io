<!DOCTYPE html>
<!--
  HayMedics Hospital — installable app (PWA) wrapper
  ==================================================
  1) Paste your CURRENT Apps Script /exec link into the APP_URL line below
     (it must be the exact link that works when you open it directly).
  2) Keep index.html, manifest.json, service-worker.js and all icon .png files together.
  3) Upload the folder to GitHub Pages / your domain, e.g. haymedicsacademy.com/hospital/
  4) On a phone: Android Chrome shows "Install app"; iPhone Safari: Share > Add to Home Screen.
  If you re-deploy and the /exec changes, update APP_URL and re-upload this file.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>HayMedics Telemedicine</title>
<meta name="description" content="HayMedics Telemedicine Service.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3E7B">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HayMedics Telemedicine">
<style>
  :root{--navy:#1E3E7B;--gold:#F4A522}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--navy);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #app{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#fff}
  #splash{position:fixed;inset:0;z-index:10;background:radial-gradient(120% 90% at 20% 10%,#2B579E,#1E3E7B 55%,#0C1A38);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .4s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .logo{width:96px;height:96px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(0,0,0,.35)}
  #splash h1{font-weight:800;font-size:1.5rem;margin-top:18px;letter-spacing:.3px}
  #splash p{color:#9FB6DE;font-size:.9rem;margin-top:4px}
  #splash .bar{margin-top:22px;width:150px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
  #splash .bar i{display:block;height:100%;width:40%;background:var(--gold);border-radius:5px;animation:load 1.1s infinite ease-in-out}
  @keyframes load{0%{margin-left:-40%}100%{margin-left:100%}}
  #install{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:8px;background:var(--gold);color:#0C1A38;border:none;border-radius:999px;padding:13px 22px;font-weight:800;font-size:.95rem;box-shadow:0 8px 22px rgba(0,0,0,.3);cursor:pointer}
  #ios{position:fixed;left:16px;right:16px;bottom:20px;z-index:20;display:none;background:rgba(255,255,255,.96);color:#12203c;border-radius:14px;padding:14px 16px;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
  #ios b{color:var(--navy)}
</style>
</head>
<body>
  <div id="splash">
    <span class="logo">
      <svg width="60" height="60" viewBox="0 0 100 100"><rect x="25" y="20" width="50" height="60" rx="6" fill="#1E3E7B"/><rect x="25" y="20" width="50" height="16" rx="6" fill="#122A54"/><rect x="45" y="24" width="10" height="3" rx="1.5" fill="#fff"/><rect x="48.5" y="21.5" width="3" height="8" rx="1.5" fill="#fff"/><rect x="33" y="44" width="26" height="4" rx="2" fill="#D2E0EE"/><rect x="33" y="52" width="20" height="4" rx="2" fill="#D2E0EE"/><path d="M33 66 h8 l4 -8 l5 12 l3 -6 h9" fill="none" stroke="#F4A522" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </span>
    <h1>HayMedics</h1>
    <p>Telemedicine Service</p>
    <div class="bar"><i></i></div>
  </div>

  <iframe id="app" title="HayMedics Telemedicine" allow="clipboard-write; camera; microphone" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <button id="install"><span>&#11015;&#65039;</span> Install app</button>
  <div id="ios">&#128242; To install: tap <b>Share</b>, then <b>Add to Home Screen</b>.</div>

<script>
  /* ====== 1) YOUR APP LINK — paste your current Apps Script /exec URL here ====== */
  var APP_URL = "https://script.google.com/macros/s/AKfycbwpMb2ccMKu-26ze18yaecM1Gdwu2JKfgf2X_5vQrBrUiEwmrBhYfTD_1w-dSwPJNN0/exec"; // <-- REPLACE with the /exec link that works when opened directly

  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  frame.src = APP_URL;
  frame.addEventListener('load', function(){ setTimeout(function(){ splash.classList.add('hide'); }, 400); });
  setTimeout(function(){ splash.classList.add('hide'); }, 6000);

  /* ====== 2) Service worker: installable AND self-updating ====== */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').then(function(reg){
        reg.update();
        reg.addEventListener('updatefound', function(){
          var sw = reg.installing; if(!sw) return;
          sw.addEventListener('statechange', function(){
            if(sw.state === 'installed' && navigator.serviceWorker.controller){ window.location.reload(); }
          });
        });
      }).catch(function(){});
      var reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){ if(reloaded) return; reloaded=true; window.location.reload(); });
    });
  }

  /* ====== 3) Android install button ====== */
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; document.getElementById('install').style.display = 'inline-flex'; });
  document.getElementById('install').addEventListener('click', function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; document.getElementById('install').style.display='none'; }); });
  window.addEventListener('appinstalled', function(){ document.getElementById('install').style.display='none'; });

  /* ====== 4) iPhone hint ====== */
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (isIOS && !standalone) { setTimeout(function(){ document.getElementById('ios').style.display='block'; setTimeout(function(){ var el=document.getElementById('ios'); if(el) el.style.display='none'; }, 8000); }, 1500); }
</script>
</body>
</html>
